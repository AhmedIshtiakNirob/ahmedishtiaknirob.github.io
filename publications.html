     <div class="body">
      <p class="desc">${esc(p.d)}</p>
      <div class="contrib"><div class="contrib-label">My Contribution</div><div class="contrib-text">${esc(p.c)}</div></div>
      <div class="actions"><a class="view ${p.linklabel==="Google Scholar"?"scholar":""}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.linklabel)} <span>↗</span></a></div>
      ${p.doi?`<div class="doi"><strong>DOI:</strong> ${esc(p.doi)}</div>`:""}
     </div>
    </details>`).join("")}</div>
   <div class="empty">No matching publication found.</div>
 </section>`;
}).join("");

document.querySelectorAll("[data-target]").forEach(el=>el.addEventListener("click",()=>{
 const target=document.getElementById(el.dataset.target);
 if(target) target.scrollIntoView({behavior:"smooth",block:"start"});
}));
const search=document.getElementById("search");
if(search) search.addEventListener("input",()=>{
 const q=search.value.trim().toLowerCase();
 document.querySelectorAll(".paper").forEach(p=>p.hidden=!!q&&!p.dataset.search.includes(q));
 document.querySelectorAll(".section").forEach(s=>{
  const cards=[...s.querySelectorAll(".paper")], empty=s.querySelector(".empty");
  if(empty) empty.style.display=cards.length&&cards.every(c=>c.hidden)?"block":"none";
 });
});
</script>
</body>
</html>
